spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/vros
spring.security.oauth2.client.registration.keycloak.client-id=vros-app
spring.security.oauth2.client.registration.keycloak.client-secret=vros-secret
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8180/realms/vros
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username