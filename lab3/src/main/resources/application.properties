spring.application.name=lab3

# log-uri scurte, ca sa se citeasca usor in consola
logging.pattern.console=%-5level %logger{0} : %msg%n

# ===== Library configuration (proprietati custom) =====
# politica de imprumut: fixed (default) | role
library.policy=fixed
# limita pentru FixedLimitPolicy (si default pentru roluri neconfigurate)
library.max-books=3
# limitele pentru RoleBasedPolicy
library.role-limits.STUDENT=2
library.role-limits.REGULAR=3
library.role-limits.PREMIUM=5
# evenimentul se publica cand un membru are MAI MULT de atatea carti
library.event-threshold=2
